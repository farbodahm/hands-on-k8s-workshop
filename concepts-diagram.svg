<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>

  <!-- actors -->
  <rect x="60" y="28" width="190" height="48" rx="6" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="155" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#4527a0">Web browser</text>
  <text x="155" y="67" text-anchor="middle" font-size="11" fill="#5e35b1">external traffic</text>

  <rect x="790" y="28" width="200" height="48" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/>
  <text x="890" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#283593">kubectl / helm</text>
  <text x="890" y="67" text-anchor="middle" font-size="11" fill="#3949ab">you</text>

  <!-- cluster -->
  <rect x="20" y="95" width="1000" height="745" rx="14" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <text x="38" y="123" font-size="16" font-weight="700" fill="#424242">Cluster</text>
  <text x="105" y="123" font-size="12" fill="#757575">k3d: each node is a Docker container</text>
  <text x="38" y="147" font-size="11" fill="#616161">Solid arrows: request / traffic path.   Dashed arrows: attachments (config, storage, scheduling).</text>

  <!-- control plane -->
  <rect x="700" y="160" width="290" height="86" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="712" y="185" font-size="14" font-weight="700" fill="#e65100">Control plane</text>
  <text x="712" y="207" font-size="11" fill="#ef6c00">API server &#183; scheduler</text>
  <text x="712" y="225" font-size="11" fill="#ef6c00">controller-manager &#183; etcd</text>
  <line x1="888" y1="77" x2="852" y2="158" stroke="#455a64" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="905" y="120" font-size="10" fill="#546e7a">apply / manage</text>

  <!-- namespace -->
  <rect x="50" y="270" width="940" height="330" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="64" y="296" font-size="14" font-weight="700" fill="#2e7d32">Namespace</text>
  <text x="150" y="296" font-size="12" fill="#388e3c">logical grouping (default, demo, ...)</text>

  <!-- ingress -->
  <rect x="80" y="320" width="160" height="62" rx="6" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="160" y="347" text-anchor="middle" font-size="13" font-weight="600" fill="#4527a0">Ingress</text>
  <text x="160" y="366" text-anchor="middle" font-size="10" fill="#5e35b1">routes by host / path</text>

  <!-- service -->
  <rect x="300" y="320" width="200" height="62" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="400" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#f57f17">Service (ClusterIP)</text>
  <text x="400" y="364" text-anchor="middle" font-size="10" fill="#f9a825">stable address &#183; load-balances</text>

  <!-- deployment -->
  <rect x="80" y="410" width="510" height="180" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="92" y="434" font-size="13" font-weight="700" fill="#1565c0">Deployment &#8594; ReplicaSet</text>

  <!-- pod 1 -->
  <rect x="95" y="450" width="150" height="118" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.3"/>
  <text x="107" y="472" font-size="12" font-weight="600" fill="#0d47a1">Pod</text>
  <rect x="107" y="484" width="126" height="70" rx="4" fill="#f1f8e9" stroke="#7cb342" stroke-width="1"/>
  <text x="170" y="512" text-anchor="middle" font-size="11" fill="#558b2f">container</text>
  <text x="170" y="532" text-anchor="middle" font-size="9" fill="#7cb342">hello-go</text>

  <!-- pod 2 -->
  <rect x="255" y="450" width="150" height="118" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.3"/>
  <text x="267" y="472" font-size="12" font-weight="600" fill="#0d47a1">Pod</text>
  <rect x="267" y="484" width="126" height="70" rx="4" fill="#f1f8e9" stroke="#7cb342" stroke-width="1"/>
  <text x="330" y="512" text-anchor="middle" font-size="11" fill="#558b2f">container</text>
  <text x="330" y="532" text-anchor="middle" font-size="9" fill="#7cb342">hello-go</text>

  <!-- pod 3 -->
  <rect x="415" y="450" width="150" height="118" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.3"/>
  <text x="427" y="472" font-size="12" font-weight="600" fill="#0d47a1">Pod</text>
  <rect x="427" y="484" width="126" height="70" rx="4" fill="#f1f8e9" stroke="#7cb342" stroke-width="1"/>
  <text x="490" y="512" text-anchor="middle" font-size="11" fill="#558b2f">container</text>
  <text x="490" y="532" text-anchor="middle" font-size="9" fill="#7cb342">hello-go</text>

  <!-- configmap / secret -->
  <rect x="635" y="320" width="170" height="76" rx="6" fill="#fffde7" stroke="#fbc02d" stroke-width="1.5"/>
  <text x="720" y="349" text-anchor="middle" font-size="12" font-weight="600" fill="#f9a825">ConfigMap / Secret</text>
  <text x="720" y="369" text-anchor="middle" font-size="10" fill="#fbc02d">config &amp; credentials</text>

  <!-- pvc -->
  <rect x="635" y="414" width="170" height="64" rx="6" fill="#e0f7fa" stroke="#00acc1" stroke-width="1.5"/>
  <text x="720" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#00838f">PVC &#8594; PV</text>
  <text x="720" y="460" text-anchor="middle" font-size="10" fill="#00acc1">persistent storage</text>

  <!-- postgres pod -->
  <rect x="635" y="498" width="170" height="80" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.3"/>
  <text x="720" y="520" text-anchor="middle" font-size="12" font-weight="600" fill="#0d47a1">Pod (StatefulSet)</text>
  <rect x="650" y="530" width="140" height="38" rx="4" fill="#f1f8e9" stroke="#7cb342" stroke-width="1"/>
  <text x="720" y="554" text-anchor="middle" font-size="11" fill="#558b2f">Postgres</text>

  <!-- intra-namespace arrows -->
  <line x1="155" y1="77" x2="155" y2="318" stroke="#455a64" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="241" y1="351" x2="298" y2="351" stroke="#455a64" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="378" y1="383" x2="338" y2="408" stroke="#455a64" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="360" y="403" font-size="9" fill="#546e7a">by label</text>

  <line x1="634" y1="362" x2="568" y2="470" stroke="#455a64" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arw)"/>
  <text x="576" y="420" font-size="9" fill="#546e7a">env / files</text>

  <line x1="720" y1="479" x2="720" y2="496" stroke="#455a64" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arw)"/>
  <line x1="591" y1="522" x2="632" y2="532" stroke="#455a64" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arw)"/>
  <text x="583" y="512" font-size="9" fill="#546e7a">DB connection</text>

  <!-- nodes -->
  <rect x="50" y="635" width="940" height="175" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="64" y="662" font-size="14" font-weight="700" fill="#37474f">Nodes</text>
  <text x="120" y="662" font-size="12" fill="#546e7a">physical hosts where Pods actually run</text>

  <rect x="80" y="680" width="420" height="115" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.3"/>
  <text x="95" y="705" font-size="13" font-weight="600" fill="#37474f">worker node 1</text>
  <text x="95" y="727" font-size="10" fill="#607d8b">kubelet &#183; container runtime &#183; kube-proxy</text>

  <rect x="520" y="680" width="420" height="115" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.3"/>
  <text x="535" y="705" font-size="13" font-weight="600" fill="#37474f">worker node 2</text>
  <text x="535" y="727" font-size="10" fill="#607d8b">kubelet &#183; container runtime &#183; kube-proxy</text>

  <!-- scheduling arrows -->
  <line x1="170" y1="569" x2="250" y2="678" stroke="#455a64" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arw)"/>
  <line x1="490" y1="569" x2="640" y2="678" stroke="#455a64" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arw)"/>
  <text x="300" y="624" font-size="10" fill="#455a64">Pods are scheduled onto nodes</text>

  <!-- caption -->
  <text x="520" y="866" text-anchor="middle" font-size="12" fill="#424242">A Pod belongs to a Namespace (logical) but runs on a Node (physical).</text>
  <text x="520" y="884" text-anchor="middle" font-size="12" fill="#424242">Deployments manage Pods; Services and Ingress route traffic to them.</text>
</svg>
